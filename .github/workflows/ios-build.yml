name: 构建 iOS IPA

# 本机没装 Xcode 时的编译方案。
# 推代码上去 → 自动编译 → 在 Artifacts 里下载 unsigned IPA。
#
# 公开仓库免费；私有仓库每月 2000 分钟 macOS runner 额度，够个人用。
#
# 用法：
#   1. 把这个目录推到一个 GitHub 仓库
#   2. 仓库 → Actions → 「构建 iOS IPA」→ Run workflow
#   3. 编译完在页面底部 Artifacts 里下载 clipbar-ipa
#
# 也可以手动触发：Actions 页面 → 选择 workflow → Run workflow

on:
  workflow_dispatch:
  push:
    branches: [ main, master, ios ]
    paths:
      - '**/*.swift'
      - '**/*.pbxproj'
      - '**/*.plist'
      - '**/*.entitlements'
      - '.github/workflows/ios-build.yml'
      - 'build.sh'
      - 'gen_xcodeproj.py'
      - 'verify_pbxproj.py'

jobs:
  build:
    # macOS runner 才能编译 iOS
    runs-on: macos-14

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 工程可能在仓库根目录，也可能在 ClipBar-iOS/ 子目录下。
      # 统一探测一次，后续步骤都用探测到的路径。
      - name: 定位工程目录
        id: locate
        run: |
          if [ -f "ClipBar.xcodeproj/project.pbxproj" ]; then
            echo "dir=." >> $GITHUB_OUTPUT
          elif [ -f "ClipBar-iOS/ClipBar.xcodeproj/project.pbxproj" ]; then
            echo "dir=ClipBar-iOS" >> $GITHUB_OUTPUT
          else
            echo "找不到 ClipBar.xcodeproj"; exit 1
          fi
          echo "工程目录: ${{ steps.locate.outputs.dir }}"

      - name: 校验工程文件
        run: |
          cd "${{ steps.locate.outputs.dir }}"
          python3 verify_pbxproj.py
          plutil -lint ClipBar.xcodeproj/project.pbxproj

      - name: 编译（无签名）
        run: |
          cd "${{ steps.locate.outputs.dir }}"
          chmod +x build.sh
          ./build.sh

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: clipbar-ipa
          path: ${{ steps.locate.outputs.dir }}/build/ClipBar-unsigned.ipa
          retention-days: 30
          if-no-files-found: error
